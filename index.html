<!doctype html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GeoHry</title>
    <meta name="description" content="Zeměpisné minihry: mapy, vlajky a dedukce." />
    <meta name="theme-color" content="#f3f8fa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b1117" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <!-- náhled odkazu v chatech a na sítích; adresu obrázku doplní vite.config.ts (viz SITE_URL) -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="cs_CZ" />
    <meta property="og:title" content="GeoHry" />
    <meta property="og:description" content="Zeměpisné minihry: mapy, vlajky a dedukce. Každý den nová výzva." />
    <meta property="og:image" content="__SITE_URL__og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Nápis GeoHry, signální vlajky, kompasová růžice a řada státních vlajek" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // tmavý režim nastavit hned, ať stránka při načtení nezablikne světlá
      try {
        if (JSON.parse(localStorage.getItem('geohry:theme')) === 'dark') document.documentElement.dataset.theme = 'dark'
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
